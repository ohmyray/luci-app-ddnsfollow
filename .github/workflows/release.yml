name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(date +%Y%m%d%H%M)" >>"$GITHUB_OUTPUT"
          fi

      - name: Syntax check
        run: |
          set -e
          for f in install.sh uninstall.sh scripts/build-ipk.sh \
                   src/usr/bin/ddns-follow src/usr/bin/ddns-follow-status \
                   src/etc/hotplug.d/iface/95-lan6-prefix \
                   src/etc/uci-defaults/99-ddnsfollow; do
            echo "--> $f"
            bash -n "$f"
            dash -n "$f" || echo "  (dash 不适用，已通过 bash 检查)"
          done

          echo "--> JSON"
          for f in $(find src -name '*.json'); do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
            echo "  ok $f"
          done

          echo "--> JS"
          node --check src/www/luci-static/resources/view/ddnsfollow/overview.js

      - name: Build ipk
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh "${{ steps.ver.outputs.version }}"

      - name: Build source tarball
        run: |
          OUT="/tmp/luci-app-ddnsfollow-${{ steps.ver.outputs.version }}.tar.gz"
          tar --exclude=.git --exclude=build --exclude='*.tar.gz' -czf "$OUT" .
          mv "$OUT" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/*.ipk
            luci-app-ddnsfollow-*.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/*.ipk
            luci-app-ddnsfollow-*.tar.gz
